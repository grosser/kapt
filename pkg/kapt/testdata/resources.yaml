# a job that violates the policy and one that does not
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bad
  namespace: apps
spec:
  backoffLimit: 100
  template:
    spec:
      restartPolicy: Never
      containers:
      - {name: main, image: alpine}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: good
  namespace: apps
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
      - {name: main, image: alpine}
